name: セキュリティ関連 / Security-related / 安全相关
description: セキュリティ上の問題や不審な挙動を報告する / Report a security problem or suspicious behavior / 报告安全问题或可疑行为
body:
  - type: markdown
    attributes:
      value: |
        このIssueは公開されます。報告の対象や方針は [SECURITY.ja.md](https://github.com/Omanjusan/Nekoviewer/blob/main/SECURITY.ja.md) を参照してください。
        This issue is public. For what to report and the policy, see [SECURITY.md](https://github.com/Omanjusan/Nekoviewer/blob/main/SECURITY.md).
        此 Issue 是公开的。关于报告的对象和方针，请参阅 [SECURITY.md](https://github.com/Omanjusan/Nekoviewer/blob/main/SECURITY.md)（英文）。

        翻訳を通すので言語は問いません。 / Any language is fine (reports are run through translation). / 我们会通过翻译阅读，因此可以使用任何语言。
  - type: dropdown
    id: kind
    attributes:
      label: 現象の種類 / Type of problem / 问题类型
      options:
        - 意図しない通信 / Unintended network traffic / 非预期的网络通信
        - 意図しないファイルの変更 / Unintended file changes / 非预期的文件更改
        - 異常終了や乗っ取りにつながる挙動 / Crashes or exploitable behavior / 崩溃或可被利用的行为
        - 配布物の検出（ウイルス対策ソフト） / Release file flagged by antivirus / 发行文件被杀毒软件检测到
        - 設定やキャッシュの書き込み先 / Settings or cache written elsewhere / 设置或缓存被写入其他位置
        - その他 / Other / 其他
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: バージョン / Version / 版本
      description: "Nekoviewerのバージョン（例: 1.10.0） / Nekoviewer version (e.g. 1.10.0) / Nekoviewer 的版本（例如：1.10.0）"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows
        - Linux
        - その他 / Other / 其他
    validations:
      required: true
  - type: dropdown
    id: distribution
    attributes:
      label: 配布形態 / Distribution type / 发行形式
      options:
        - exe
        - Flatpak
        - AppImage
        - ソースビルド / Source build / 源码构建
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 問題の内容 / What happened / 问题内容
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順 / Steps to reproduce / 复现步骤
  - type: textarea
    id: logs
    attributes:
      label: ログ・スクリーンショット / Logs or screenshots / 日志・截图
      description: 可能であれば添付してください。 / Attach them if possible. / 如有可能，请附上。
  - type: checkboxes
    id: files
    attributes:
      label: 添付ファイルについて / About attached files / 关于附件
      options:
        - label: 添付するファイルに、著作物や個人情報（写真・住所・電話番号・名前）は含まれていません。 / The attached files contain no copyrighted material or personal information (photos, addresses, phone numbers, names). / 附件中不包含受版权保护的内容或个人信息（照片、住址、电话号码、姓名）。
          required: true
