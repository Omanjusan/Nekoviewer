name: Build

on:
  workflow_dispatch:             # Actions画面またはgh CLIから手動実行
  pull_request:
    branches: [develop, main]   # feat→dev、dev→mainのPR時にCI検証
  push:
    tags: ['v*']            # リリース用タグpush時にビルド&アーティファクト生成

jobs:
  build-windows:
    runs-on: windows-latest

    env:
      VCPKG_ROOT: C:\vcpkg
      CARGO_TARGET_DIR: C:\cgt

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install NASM
        uses: ilammy/setup-nasm@v1

      - name: Cache vcpkg dav1d
        uses: actions/cache@v4
        id: vcpkg-cache
        with:
          path: C:\vcpkg\packages\dav1d_x64-windows-static
          key: vcpkg-dav1d-x64-windows-static-v1

      - name: Install dav1d via vcpkg
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: C:\vcpkg\vcpkg.exe install dav1d:x64-windows-static

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            C:\cgt
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build (PR check)
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/'))
        run: cargo build

      - name: Build release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: cargo build --release

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: nekoviewer-windows-x64
          path: C:\cgt\release\nekoviewer.exe
          retention-days: 30

  build-linux-appimage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake meson ninja-build pkg-config nasm

      - name: Cache dav1d (musl静的ビルド)
        uses: actions/cache@v4
        id: dav1d-musl-cache
        with:
          path: /usr/local/musl
          key: dav1d-musl-v1

      - name: Build dav1d for musl
        if: steps.dav1d-musl-cache.outputs.cache-hit != 'true'
        run: |
          BUILD_DIR=$(mktemp -d)
          git clone --depth 1 https://code.videolan.org/videolan/dav1d.git "$BUILD_DIR/dav1d"
          CC=musl-gcc meson setup "$BUILD_DIR/build" "$BUILD_DIR/dav1d" \
              --default-library=static --buildtype=release --libdir=lib --prefix=/usr/local/musl
          ninja -C "$BUILD_DIR/build"
          sudo ninja -C "$BUILD_DIR/build" install

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-musl-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-musl-cargo-

      - name: Build (PR check)
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/'))
        env:
          PKG_CONFIG_PATH: /usr/local/musl/lib/pkgconfig
          PKG_CONFIG_ALLOW_CROSS: "1"
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --target x86_64-unknown-linux-musl

      - name: Build release + AppImage (tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          PKG_CONFIG_PATH: /usr/local/musl/lib/pkgconfig
          PKG_CONFIG_ALLOW_CROSS: "1"
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          cargo build --release --target x86_64-unknown-linux-musl
          ./packaging/appimage/build-appimage.sh

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: nekoviewer-linux-x86_64-appimage
          path: target/appimage/Nekoviewer-*-x86_64.AppImage
          retention-days: 30
