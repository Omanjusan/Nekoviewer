name: Build

on:
  workflow_dispatch:             # Actions画面またはgh CLIから手動実行
  pull_request:
    branches: [develop, main]   # feat→dev、dev→mainのPR時にCI検証
  push:
    tags: ['v*']            # リリース用タグpush時にビルド&アーティファクト生成

jobs:
  verify-release-ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release tag belongs to main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tags must point to a commit on main." >&2
            exit 1
          }

  build-windows:
    needs: verify-release-ref
    runs-on: windows-latest

    env:
      VCPKG_ROOT: C:\vcpkg
      CARGO_TARGET_DIR: C:\cgt

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install NASM
        uses: ilammy/setup-nasm@v1

      - name: Cache vcpkg dav1d
        uses: actions/cache@v4
        id: vcpkg-cache
        with:
          path: C:\vcpkg\packages\dav1d_x64-windows-static
          key: vcpkg-dav1d-x64-windows-static-v1

      - name: Install dav1d via vcpkg
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: C:\vcpkg\vcpkg.exe install dav1d:x64-windows-static

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            C:\cgt
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build (PR check)
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/'))
        run: cargo build

      - name: Build release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: cargo build --release

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: nekoviewer-windows-x64
          path: C:\cgt\release\nekoviewer.exe
          retention-days: 30

  build-linux-flatpak:
    needs: verify-release-ref
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Nekoviewer-x86_64.flatpak
          manifest-path: io.github.Omanjusan.Nekoviewer.yml
          cache-key: flatpak-builder-${{ hashFiles('Cargo.lock', 'io.github.Omanjusan.Nekoviewer.yml', 'packaging/flatpak/cargo-sources.json') }}
          artifact-name: nekoviewer-linux-x86_64-flatpak
