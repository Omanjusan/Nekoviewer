name: (reusable) Build Linux Flatpak

on:
  workflow_call:
    inputs:
      retention-days:
        type: number
        default: 30

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Nekoviewer-x86_64.flatpak
          manifest-path: io.github.Omanjusan.Nekoviewer.yml
          cache-key: flatpak-builder-${{ hashFiles('Cargo.lock', 'io.github.Omanjusan.Nekoviewer.yml', 'packaging/flatpak/cargo-sources.json') }}
          upload-artifact: false

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: nekoviewer-linux-x86_64-flatpak
          path: Nekoviewer-x86_64.flatpak
          retention-days: ${{ inputs.retention-days }}
